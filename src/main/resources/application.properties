spring.application.name=crickinfo

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/crickinfo
spring.data.mongodb.auto-index-creation=true

# JWT Configuration (Secret must be at least 32 bytes for HS256)
jwt.secret=DEBU_SECRET_KEY_2026_CRICKINFO_APP_SECURE_KEY_LONGER
jwt.expiration=86400000  

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Spring Security Configuration
spring.security.user.name=disabled
spring.security.user.password=disabled
logging.level.org.springframework.security=INFO
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=200MB
